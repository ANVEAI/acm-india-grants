{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Student Travel Grant Portal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
        }

        /* Sidebar */
        .sidebar {
            height: 100vh;
            width: 220px;
            position: fixed;
            top: 0;
            left: 0;
            background-color: #2c3e50;
            padding-top: 20px;
            transition: all 0.3s;
        }

        .sidebar .portal-name {
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: #ecf0f1;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: #ecf0f1;
            padding: 12px 20px;
            text-decoration: none;
            font-size: 0.95rem;
            border-radius: 0 15px 15px 0;
            margin-bottom: 5px;
            transition: all 0.2s;
        }

        .sidebar a:hover,
        .sidebar a.active {
            background-color: #34495e;
            color: #ffffff;
        }

        .sidebar i {
            width: 20px;
        }

        /* Topbar */
        .topbar {
            height: 60px;
            width: calc(100% - 220px);
            margin-left: 220px;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            box-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 0;
            z-index: 1000;
        }

        .topbar .greeting {
            font-weight: 500;
            font-size: 1rem;
            color: #2c3e50;
        }

        .topbar .user-info {
            text-align: right;
            margin-left: 15px;
        }

        .topbar .user-info h6 {
            margin: 0;
            font-weight: 600;
        }

        .topbar .user-info p {
            margin: 0;
            font-size: 0.85rem;
            color: #7f8c8d;
        }

        .topbar .logout-btn {
            color: #2c3e50;
            font-size: 1.2rem;
            transition: all 0.2s;
        }

        .topbar .logout-btn:hover {
            color: #e74c3c;
        }

        /* Main content */
        .main-content {
            margin-left: 220px;
            margin-top: 60px;
            padding: 30px;
        }

        /* Table styling */
        .table thead {
            background-color: #34495e;
            color: #ffffff;
        }

        .table-hover tbody tr:hover {
            background-color: #ecf0f1;
        }

        .badge {
            font-size: 0.85rem;
            padding: 0.4em 0.7em;
        }

        .card:hover {
            transform: translateY(-2px);
            transition: all 0.3s ease;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
                padding-top: 60px;
            }

            .sidebar a span {
                display: none;
            }

            .sidebar .portal-name {
                display: none;
            }

            .topbar {
                width: calc(100% - 60px);
                margin-left: 60px;
            }

            .main-content {
                margin-left: 60px;
            }
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="portal-name">Student Travel Grant</div>
    <a href="{% url 'home' %}" class="active"><i class="fas fa-home me-2"></i><span>Home</span></a>
    <a href="{% url 'travel_grant_form' %}"><i class="fas fa-file-alt me-2"></i><span>Application</span></a>
    {% if user_role == "Admin" or user_role == "Reviewer" %}
    <!-- <a href="{% url 'user_management' %}"><i class="fas fa-users me-2"></i><span>User Management</span></a> -->
    {% endif %}
</div>

<!-- Topbar -->
<div class="topbar">
    <div class="d-flex align-items-center">
        <div class="greeting" id="greeting-msg"></div>
        <div class="user-info ms-3">
            <h6>{{ user_name }}</h6>
            <p>{{ user_role }}</p>
        </div>
    </div>
    <a href="{% url 'logout' %}" class="logout-btn" title="Logout"><i class="fas fa-sign-out-alt"></i></a>
</div>

<!-- Main content -->
<div class="main-content">
    {% block content %}
    <!-- Dashboard content goes here -->
    {% endblock %}
</div>

<script>
    // Greeting based on IST
    function getGreeting() {
        const now = new Date();
        // IST offset = +5:30
        const istOffset = 5.5 * 60; // in minutes
        const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
        const istTime = new Date(utc + (istOffset * 60000));
        const hours = istTime.getHours();

        if (hours < 12) return "Good Morning,";
        if (hours < 17) return "Good Afternoon,";
        return "Good Evening,";
    }

    document.getElementById('greeting-msg').innerText = getGreeting();
</script>

</body>
</html>
